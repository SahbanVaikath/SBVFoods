<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu - FreshBites</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Header (same as index.html) -->

    <!-- Menu Section -->
    <section class="menu-section">
        <div class="container">
            <h2 class="section-title">Our Menu</h2>
            
            <!-- Pizza Category -->
            <div class="menu-category" id="pizza">
                <h3 class="category-title">Pizza</h3>
                <div class="menu-grid">
                    <div class="menu-item">
                        <div class="item-image">
                            <img src="images/food-items/margherita.jpg" alt="Margherita Pizza">
                        </div>
                        <div class="item-details">
                            <h4>Margherita Pizza</h4>
                            <p>Classic pizza with tomato sauce, mozzarella, and basil</p>
                            <div class="item-price">
                                <span>$12.99</span>
                                <button class="btn-add" data-id="1" data-name="Margherita Pizza" data-price="12.99"><i class="fas fa-plus"></i> Add</button>
                            </div>
                        </div>
                    </div>
                    <!-- More pizza items -->
                </div>
            </div>
            
            <!-- Burgers Category -->
            <div class="menu-category" id="burgers">
                <h3 class="category-title">Burgers</h3>
                <div class="menu-grid">
                    <div class="menu-item">
                        <div class="item-image">
                            <img src="images/food-items/cheeseburger.jpg" alt="Cheeseburger">
                        </div>
                        <div class="item-details">
                            <h4>Classic Cheeseburger</h4>
                            <p>Beef patty with cheese, lettuce, tomato, and special sauce</p>
                            <div class="item-price">
                                <span>$8.99</span>
                                <button class="btn-add" data-id="5" data-name="Classic Cheeseburger" data-price="8.99"><i class="fas fa-plus"></i> Add</button>
                            </div>
                        </div>
                    </div>
                    <!-- More burger items -->
                </div>
            </div>
            
            <!-- Menu continues with other categories -->
        </div>
    </section>

    <!-- Footer (same as index.html) -->

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
